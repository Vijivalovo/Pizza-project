spring.application.name=product-category
eureka.instance.hostname=192.168.0.101

server.port=8082
 
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://192.168.0.101:9000/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=192.168.0.101

logging.level.com.netflix.eureka=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG

# DB config
spring.datasource.url=jdbc:postgresql://localhost:5432/product_category
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
 
# Liquibase
spring.liquibase.enabled=false